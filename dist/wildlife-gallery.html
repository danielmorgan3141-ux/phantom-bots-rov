const T=THREE,V=LakeVisuals,s=new T.Scene();s.background=new T.Color(0x082b34);s.fog=new T.Fog(0x082b34,12,30);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(r.domElement);const c=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,80);c.position.set(0,2,12);c.lookAt(0,.5,0);s.add(new T.HemisphereLight(0xd0fff4,0x42636a,1.8));const l=new T.DirectionalLight(0xffe8cb,2.4);l.position.set(-3,6,5);s.add(l);const fill=new T.DirectionalLight(0x72cddd,1);fill.position.set(5,2,-2);s.add(fill);let seed=5;const rand=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);const fish=[];['perch','bluegill','trout','pike'].forEach((species,i)=>{const f=V.buildFish({map:V.perchTexture(),species});f.scale.multiplyScalar(species==='pike'?1.15:1.4);f.position.set((i-1.5)*2.3,1.75,0);f.rotation.y=-Math.PI/2-.15;s.add(f);fish.push(f)});const corals=[];for(let i=0;i<3;i++){const g=V.buildCoral(rand);g.position.set((i-1)*2.8,-1.2,0);g.scale.set(1.8,1.7,1.8);s.add(g);corals.push(g)}const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x335f5d,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.21;s.add(floor);function resize(){r.setSize(innerWidth,innerHeight);c.aspect=innerWidth/innerHeight;c.position.z=Math.max(12,5.7/(Math.tan(19*Math.PI/180)*c.aspect));c.lookAt(0,.5,0);c.updateProjectionMatrix()}addEventListener('resize',resize);resize();function frame(t){requestAnimationFrame(frame);fish.forEach((f,i)=>{f.position.y=1.75+Math.sin(t*.001+i)*.045;f.userData.tail.rotation.y=Math.sin(t*.005+i)*.3;for(const p of f.userData.pectorals)p.mesh.rotation.z=p.side*(.15+Math.sin(t*.004+i)*.12)});corals.forEach(g=>g.userData.branches.forEach(b=>b.pivot.rotation.z=Math.sin(t*.00085+b.phase)*.025));r.render(s,c)}requestAnimationFrame(frame);
